services:
  postgres:
    image: postgres:18-alpine
    container_name: snack_overflow_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env.docker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.docker}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env.docker}
      PGDATA: ${PGDATA:-/var/lib/postgresql/18/docker}
    volumes:
      - snack_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - snack-net

  migration:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrate
    container_name: snack_overflow_migrate
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env.docker}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - snack-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    container_name: snack_overflow_api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env.docker}
      PORT: ${PORT:-4000}
      NODE_ENV: ${NODE_ENV:-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env.docker}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      COOKIE_NAME: ${COOKIE_NAME:-snack_session}
      ENABLE_MEMBER_REGISTRATION: ${ENABLE_MEMBER_REGISTRATION:-true}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - snack-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    container_name: snack_overflow_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - snack-net

networks:
  snack-net:
    driver: bridge

volumes:
  snack_postgres_data:
